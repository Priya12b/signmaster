{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignMaster - Expressing Feelings in ASL</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/signmaster-theme.css' %}">
    <style>
        .feeling-card {
            background: white;
            border: 1px solid var(--sm-border);
            border-radius: var(--sm-radius-xl);
            padding: 24px;
            box-shadow: var(--sm-shadow-sm);
            text-align: center;
            transition: all var(--sm-transition-smooth);
        }
        .feeling-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--sm-shadow-lg);
            border-color: var(--sm-primary);
        }
        .feeling-img {
            max-width: 100%;
            height: auto;
            max-height: 520px;
            object-fit: contain;
            border-radius: var(--sm-radius-md);
            margin: 0 auto;
        }
    </style>
</head>
<body class="sm-page-bg">
{% include 'partials/navbar.html' %}

    <div class="container py-4" style="max-width: 960px;">
        <div class="text-center mb-4">
            <span class="sm-badge sm-badge-primary mb-2">Intermediate Module</span>
            <h2 class="fw-bold text-dark mb-1">Expressing Feelings & Emotions in ASL</h2>
            <p class="text-muted mb-0">Learn essential facial expressions, mood signs, and emotional nuance.</p>
        </div>

        <div class="d-flex flex-column gap-4">
            <div class="feeling-card">
                <img src="{% static 'images/feelings/First.png' %}" alt="Feeling 1" class="feeling-img">
            </div>
            <div class="feeling-card">
                <img src="{% static 'images/feelings/second.png' %}" alt="Feeling 2" class="feeling-img">
            </div>
            <div class="feeling-card">
                <img src="{% static 'images/feelings/thied.png' %}" alt="Feeling 3" class="feeling-img">
            </div>
            <div class="feeling-card">
                <img src="{% static 'images/feelings/yes-no.png' %}" alt="Feeling 4" class="feeling-img">
            </div>
            <div class="feeling-card">
                <img src="{% static 'images/feelings/Please.png' %}" alt="Feeling 5" class="feeling-img">
            </div>
            <div class="feeling-card">
                <img src="{% static 'images/feelings/Help.png' %}" alt="Feeling 6" class="feeling-img">
            </div>
            <div class="feeling-card">
                <img src="{% static 'images/feelings/I_love_you.png' %}" alt="Feeling 7" class="feeling-img">
            </div>
        </div>

        <div class="text-center mt-4">
            <a href="{% url 'dashboard' %}" class="sm-btn sm-btn-outline">
                <i class="bi bi-arrow-left"></i>
                <span>Back to Dashboard</span>
            </a>
            <a href="{% url 'asl_recognize' %}" class="sm-btn sm-btn-primary ms-2">
                <span>Practice in ASL Vision &rarr;</span>
            </a>
        </div>
    </div>
</body>
</html>
