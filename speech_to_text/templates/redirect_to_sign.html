{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignMaster - Transcription Complete</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/signmaster-theme.css' %}">
</head>
<body class="sm-page-bg">
    {% include 'partials/navbar.html' %}

    <div class="container py-5" style="max-width: 680px;">
        <div class="sm-card text-center">
            <div class="tool-icon-box mx-auto" style="background: var(--sm-accent-light); color: var(--sm-accent); width: 64px; height: 64px; font-size: 1.8rem;">
                <i class="bi bi-check-circle-fill"></i>
            </div>

            <h3 class="fw-bold text-dark mt-2 mb-2">Transcription Successful!</h3>
            <p class="text-muted mb-4">Your spoken phrase was processed and transcribed into text.</p>

            <div class="p-3 rounded-3 border mb-4 text-start" style="background: var(--sm-surface-subtle);">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <span class="small fw-bold text-muted">TRANSCRIBED PHRASE:</span>
                    <button type="button" class="sm-btn sm-btn-outline sm-btn-sm" onclick="SignMaster.copyToClipboard('{{ transcribed_text|escapejs }}', this)">
                        <i class="bi bi-copy"></i>
                        <span>Copy</span>
                    </button>
                </div>
                <div class="fs-5 fw-bold text-dark mt-1">"{{ transcribed_text }}"</div>
            </div>

            <div class="d-flex justify-content-center gap-3">
                <form action="{% url 'text_to_sign' %}" method="GET" class="d-inline">
                    <input type="hidden" name="text" value="{{ transcribed_text }}">
                    <button type="submit" class="sm-btn sm-btn-primary sm-btn-lg">
                        <i class="bi bi-translate"></i>
                        <span>Convert to ASL Signs &rarr;</span>
                    </button>
                </form>

                <a href="{% url 'speech-home' %}" class="sm-btn sm-btn-outline sm-btn-lg">
                    <i class="bi bi-mic"></i>
                    <span>Record Another</span>
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
